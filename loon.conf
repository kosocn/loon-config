# Loon 官方优先级是：本地规则 > 插件规则 > 订阅规则。
# 一条 GEOIP,CN,DIRECT 写在本地段，等于把所有解析到国内 IP 的请求
# 在插件规则之前就放行了——BlockAdvertisers 里 340 条广告域名 REJECT
# 全部轮不到执行。国内直连交给下面 [Remote Rule] 里的 ChinaMax 域名表
# 和 ChinaCompanyIp 的 IP 段，它们在插件规则之后，不会抢。

FINAL,漏网之鱼


